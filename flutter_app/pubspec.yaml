name: pma
description: PMA — Packing & Monitoring App. Voice-first factory floor logging with Firebase AI Logic hybrid inference.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for Firebase REST API (no C++ SDK — works on Windows/Android/iOS)
  http: ^1.2.2

  # Persistent storage for auth tokens and offline data
  shared_preferences: ^2.3.2

  # State Management
  provider: ^6.1.2

  # Local offline storage (cross-platform SQLite)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0

  # Charts
  fl_chart: ^0.68.0

  # Network detection
  connectivity_plus: ^6.1.4

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Excel report generation
  excel: ^4.0.6

  # File path utilities
  path_provider: ^2.1.4

  # File picker for bulk import
  file_picker: ^8.1.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  share_plus: ^12.0.2
  syncfusion_flutter_xlsio: ^29.2.11
  syncfusion_flutter_core: ^29.2.11
  syncfusion_officechart: ^29.2.11
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  syncfusion_flutter_pdf: 29.2.11
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.16.0
  record: 6.2.0
  flutter_soloud: 4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.18.0

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
msix_config:
  display_name: PMA
  publisher_display_name: PMA contributors
  identity_name: app.pma.monitor
  msix_version: 1.0.0.0
  logo_path: assets/icon/icon.png
